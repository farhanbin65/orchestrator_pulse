name: Orchestrator Pulse — Auto Post

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Keep Actions alive
        run: |
          LAST=$(cat .last_alive 2>/dev/null || echo "0")
          NOW=$(date +%s)
          DIFF=$(( (NOW - LAST) / 86400 ))
          if [ "$DIFF" -ge 50 ]; then
            echo $NOW > .last_alive
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .last_alive
            git commit -m "chore: keep-alive [skip ci]"
            git push
            echo "Keep-alive commit pushed ($DIFF days since last)"
          else
            echo "No keep-alive needed ($DIFF days since last, threshold 50)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-noto-ui-core \
            xvfb \
            libgl1

      - name: Install Python dependencies
        run: |
          pip install \
            requests \
            feedparser \
            Pillow \
            python-dotenv \
            groq \
            opencv-python-headless \
            numpy \
            bangla-text-renderer

      - name: Create .env from GitHub secrets
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BANGLA_PAGE_ID: ${{ secrets.BANGLA_PAGE_ID }}
          BANGLA_PAGE_ACCESS_TOKEN: ${{ secrets.BANGLA_PAGE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
          IG_BN_USER_ID: ${{ secrets.IG_BN_USER_ID }}
        run: |
          printf '%s=%s\n' \
            PAGE_ID "$PAGE_ID" \
            PAGE_ACCESS_TOKEN "$PAGE_ACCESS_TOKEN" \
            APP_ID "$APP_ID" \
            APP_SECRET "$APP_SECRET" \
            BANGLA_PAGE_ID "$BANGLA_PAGE_ID" \
            BANGLA_PAGE_ACCESS_TOKEN "$BANGLA_PAGE_ACCESS_TOKEN" \
            GROQ_API_KEY "$GROQ_API_KEY" \
            UNSPLASH_ACCESS_KEY "$UNSPLASH_ACCESS_KEY" \
            PEXELS_API_KEY "$PEXELS_API_KEY" \
            IG_EN_USER_ID "$IG_EN_USER_ID" \
            IG_BN_USER_ID "$IG_BN_USER_ID" > .env

      - name: Run pipeline
        run: xvfb-run python main.py

      - name: Upload card images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: output-cards
          path: output/